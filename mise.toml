min_version = { hard = "2026.11.5" }

[settings]
lockfile = true
lockfile_platforms = ["linux-x64"]

[tools]
rust = { version = "nightly-2026-10-28", profile = "minimal", components = "rustfmt,clippy,rust-src", targets = "wasm32-unknown-unknown" }
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.150"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.1"
# The Wasm pipeline (mise run build:wasm). The CLI's version must equal the wasm-bindgen crate's.
"github:wasm-bindgen/wasm-bindgen" = "0.2.129"
"aqua:WebAssembly/binaryen" = "133"

[tasks.demo]
description = "Run Atrium on 127.0.0.1:8080 with the design's invented wiki, no Mneme needed"
depends = ["build:wasm"]
run = "cargo run -- --demo --addr 127.0.0.1:8080 --viewer tailnet --allowed-hosts localhost,127.0.0.1"

[tasks.dev]
description = "Run Atrium for the tailnet on 127.0.0.1:8080, in front of ATRIUM_MNEME_URL or 127.0.0.1:8081"
depends = ["build:wasm"]
run = "cargo run -- --addr 127.0.0.1:8080 --viewer tailnet --allowed-hosts localhost,127.0.0.1 --mneme-url ${ATRIUM_MNEME_URL:-http://127.0.0.1:8081}"

[tasks.fmt]
description = "Format the Rust sources"
run = "cargo fmt --all"

[tasks."build:wasm"]
description = "Build the ui and field Wasm bundles and their glue into target/web, where the server embeds them"
sources = ["Cargo.lock", "Cargo.toml", "web/**/*"]
outputs = ["target/web/ui.js", "target/web/ui_bg.wasm", "target/web/field.js", "target/web/field_bg.wasm"]
run = """
set -eu
rm -rf target/web target/web-raw
mkdir -p target/web target/web-raw
for bundle in ui field; do
  # build-std needs std's own unstable features, so these are the only flags for this build.
  # Immediate abort leaves out panic formatting. The crate is built as a cdylib only here,
  # so native builds and tests treat it as a plain library.
  RUSTFLAGS="-Zunstable-options -Cpanic=immediate-abort" CARGO_TARGET_DIR=target/wasm \
    cargo rustc --locked --profile wasm --target wasm32-unknown-unknown \
    --config web/build-std.toml -p "atrium-web-$bundle" --lib --crate-type cdylib
  wasm-bindgen --target web --no-typescript --out-dir target/web-raw --out-name "$bundle" \
    "target/wasm/wasm32-unknown-unknown/wasm/atrium_web_$bundle.wasm"
  # The features rustc enables for wasm32. Never --all-features: Chromium rejects some.
  wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext \
    --enable-mutable-globals --enable-multivalue --enable-reference-types \
    "target/web-raw/${bundle}_bg.wasm" -o "target/web/${bundle}_bg.wasm"
  cp "target/web-raw/$bundle.js" "target/web/$bundle.js"
done
"""

[tasks."test:browser"]
description = "Drive every browser module, every route and axe in Chromium against atrium --demo, in Playwright's image (needs Docker)"
depends = ["build:wasm"]
run = "tools/browser.sh node node_modules/@playwright/test/cli.js test -c web/ui/tests/browser/playwright.config.mjs"

[tasks."bench:field"]
description = "Time the field in SwiftShader; CPUSET pins cores and PROTOTYPE adds the prototype's own field beside it (needs Docker)"
depends = ["build:wasm"]
run = "tools/browser.sh node node_modules/@playwright/test/cli.js test -c web/ui/tests/browser/bench.config.mjs"

[tasks."check:fmt"]
description = "Check formatting"
run = "cargo fmt --all -- --check"

[tasks."check:clippy"]
description = "Lint every target with warnings denied, natively and for Wasm"
depends = ["build:wasm"]
run = [
  "cargo clippy --locked --workspace --all-targets -- -D warnings",
  "cargo clippy --locked -p atrium-web-ui -p atrium-web-field --target wasm32-unknown-unknown -- -D warnings",
]

[tasks."check:test"]
description = "Run the tests against a stub that serves Mneme's example responses"
depends = ["build:wasm"]
wait_for = ["check:clippy"]
run = "cargo nextest run --locked --workspace --no-tests=fail"

[tasks."test:mneme"]
description = "Run the test against a real mneme serve; ATRIUM_MNEME_BIN names the binary"
depends = ["build:wasm"]
run = "cargo nextest run --locked --workspace --run-ignored only --no-tests=fail"

[tasks."check:advisories"]
description = "Fail on known vulnerabilities in the dependency tree"
run = "cargo deny --locked {% if env.MISE_OFFLINE %}--offline {% endif %}check advisories"

[tasks."check:workflows"]
description = "Lint the CI workflow"
run = ["actionlint", "zizmor --offline .github/workflows"]

[tasks.image]
description = "Build the image as localhost/atrium:<commit>, answer home and serve the bundles with it, and scan it with Trivy when Trivy is installed"
depends = ["build:wasm"]
run = """{% raw %}
set -eu
tag="localhost/atrium:$(git rev-parse --short HEAD)$(git diff --quiet HEAD -- || echo -dirty)"
podman build --file Containerfile --tag "$tag" .
podman image inspect "$tag" --format 'user={{.Config.User}} size={{.Size}}'
if podman run --rm --entrypoint /bin/sh "$tag" -c true 2>/dev/null; then
  echo "the image has a shell" >&2
  exit 1
fi
name="atrium-smoke-$$"
podman run --detach --name "$name" --read-only --publish 127.0.0.1::8080 "$tag" \
  --viewer tailnet --allowed-hosts localhost --mneme-url http://127.0.0.1:9 >/dev/null
port="$(podman port "$name" 8080)"
port="${port##*:}"
for _ in $(seq 50); do curl -fsS "http://127.0.0.1:$port/healthz" >/dev/null 2>&1 && break; sleep 0.1; done
curl -fsS -o /dev/null -w 'home answered %{http_code}\n' -H 'Host: localhost' "http://127.0.0.1:$port/"
script="$(curl -fsS -H 'Host: localhost' "http://127.0.0.1:$port/" | grep -o '<script[^>]*>')"
for attr in src data-ui data-ui-wasm data-field data-field-wasm; do
  url="$(printf '%s' "$script" | tr ' >' '\\n\\n' | grep "^$attr=" | cut -d= -f2 | tr -d '"')"
  curl -fsS -o /dev/null -w "$attr %{http_code} %{content_type} %{size_download} bytes\\n" \
    -H 'Host: localhost' "http://127.0.0.1:$port$url"
done
podman stop --time 10 "$name" >/dev/null
code="$(podman inspect "$name" --format '{{.State.ExitCode}}')"
podman rm "$name" >/dev/null
[ "$code" = 0 ] || { echo "exited $code on SIGTERM" >&2; exit 1; }
echo "exited 0 on SIGTERM"
if command -v trivy >/dev/null; then
  scratch="$(mktemp -d)"
  trap 'rm -rf "$scratch"' EXIT
  podman save --quiet --format docker-archive --output "$scratch/atrium.tar" "$tag"
  trivy image --quiet --input "$scratch/atrium.tar" --severity HIGH,CRITICAL --exit-code 1
else
  echo "trivy is not installed: the image was not scanned"
fi
echo "$tag"
{% endraw %}"""

[tasks.parity]
description = "Compare each route of atrium --demo with the prototype at 1440 and 390 px, day and night; scripts off, or on under reduced motion with --scripts (needs Docker)"
depends = ["build:wasm"]
run = "PROTOTYPE=\"${PROTOTYPE:-/home/blackbox/work/atrium-concepts/atrium}\" tools/browser.sh node tools/check/parity.mjs"

[tasks.capture]
description = "Record a short visit to atrium --demo and screenshot home, a page and the machines at 1440 and 390 px, day and night, into target/check/final (needs Docker)"
depends = ["build:wasm"]
run = "tools/browser.sh node tools/check/capture.mjs"

[tasks.axe]
description = "Run axe on each route of atrium --demo at 1440 and 390 px, day and night, scripts on and off (needs Docker)"
depends = ["build:wasm"]
run = "tools/browser.sh node node_modules/@playwright/test/cli.js test -c web/ui/tests/browser/playwright.config.mjs axe.spec"

[tasks.gate]
description = "Everything that proves the repository is good"
depends = ["check:fmt", "check:clippy", "check:test", "check:advisories", "check:workflows"]
