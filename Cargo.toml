[workspace]
resolver = "3"
members = ["crates/*", "web/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/notes-supply/atrium"

[workspace.dependencies]
atrium-core = { path = "crates/atrium-core" }
atrium-ui = { path = "crates/atrium-ui" }
atrium-wiki = { path = "crates/atrium-wiki" }
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "query", "tokio"] }
comrak = { version = "0.59.0", default-features = false }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false }
jiff = { version = "0.2.42", default-features = false, features = ["std", "tzdb-bundle-always"] }
maud = { version = "0.27.0", features = ["axum"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false }
scraper = "0.29.0"
serde = "1.0.229"
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tower = "0.5.3"
wasm-bindgen = "=0.2.129"
web-sys = "0.3.106"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = "deny"

[workspace.lints.cargo]
unused_dependencies = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"

# Only for the Wasm modules, with web/build-std.toml (mise run build:wasm).
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
