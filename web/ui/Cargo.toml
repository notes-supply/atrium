[package]
name = "atrium-web-ui"
description = "Every small behaviour of Atrium's pages as one Wasm bundle, each module mounted by its data-module name."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
  "console",
  "Document",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "HtmlDialogElement",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "Location",
  "Node",
  "NodeList",
  "Window",
] }
