[package]
name = "atrium-palette"
description = "The command palette, a Wasm module: Ctrl+K or Cmd+K lists the page's commands, and their keys run them."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
  "Document",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "HtmlDialogElement",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "Location",
  "Node",
  "NodeList",
  "Window",
] }
