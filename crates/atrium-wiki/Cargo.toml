[package]
name = "atrium-wiki"
description = "The wiki feature: Mneme's client, the wiki's routes and Markdown rendering."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# A stand-in for Mneme that serves its example responses, for tests.
stub = ["dep:axum", "dep:tokio"]

[dependencies]
axum = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["query"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
tokio.workspace = true
